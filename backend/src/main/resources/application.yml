spring:
  application:
    name: demo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 50  # o padrão é 2000; catálogo é público
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # separado por vírgula; em prod, o domínio real do front
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
