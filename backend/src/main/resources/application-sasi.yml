# Profile do trabalho TPI SASI: HTTPS seletivo com certificado OpenSSL.
#
#  - Conector principal HTTPS na porta 8443 (certificado gerado por certs/generate-certs.sh)
#  - Conector HTTP puro na porta 8080 (SasiServerConfig)
#  - requiresChannel força HTTPS só nas rotas sensíveis (login, checkout, conta, APIs de dados)
#  - O Spring serve a SPA Angular (build copiado para resources/static)
#
# Rodar:  SPRING_PROFILES_ACTIVE=sasi ./mvnw spring-boot:run   (a partir de backend/)

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:../certs/keystore.p12
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-alias: jequi
  error:
    include-stacktrace: never
    include-message: never

# Desliga o Swagger (dado sensível de API não fica exposto)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  http-port: 8080
  require-ssl-on-sensitive: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://localhost:8443}
  payment:
    provider: fake
    fake-open-simulation: false
  shipping:
    provider: fake
  cookie:
    secure: true   # o login/sessão só trafega em HTTPS
  stock:
    reservation-expiration-minutes: 20
  order:
    checkout-expiration-minutes: 30

jwt:
  secret: ${JWT_SECRET:sasi-demo-secret-trocar-em-producao-0123456789}
  expiration: ${JWT_EXPIRATION:3600000}
