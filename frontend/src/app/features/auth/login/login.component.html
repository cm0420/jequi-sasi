<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <app-back-link to="/" label="Voltar ao catálogo" />

    <div class="text-center mb-8">
      <p class="font-body text-xs tracking-[2px] uppercase text-clay mb-1">Jequí</p>
      <h1 class="font-display text-5xl text-ink">Entrar</h1>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="bg-surface border border-hairline rounded-3xl p-5 sm:p-8 flex flex-col gap-5"
    >
      @if (errorMessage()) {
        <p role="alert" class="font-body text-xs text-danger border border-danger/25 bg-danger/5 rounded-xl px-3 py-2">
          {{ errorMessage() }}
        </p>
      }

      <div class="flex flex-col gap-1.5">
        <label for="email" class="font-body text-[11px] tracking-wide uppercase text-ink/70">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="font-body border border-hairline rounded-xl px-4 py-3 text-ink focus:outline-none focus:border-forest focus:ring-4 focus:ring-forest/10"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="font-body text-[11px] text-danger">Informe um e-mail válido.</span>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="font-body text-[11px] tracking-wide uppercase text-ink/70">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="font-body border border-hairline rounded-xl px-4 py-3 text-ink focus:outline-none focus:border-forest focus:ring-4 focus:ring-forest/10"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="font-body text-[11px] text-danger">Informe sua senha.</span>
        }
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="btn font-body font-semibold text-base px-7 py-3 rounded-full border border-ink bg-forest text-canvas  disabled:opacity-60"
      >
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="text-center font-body text-base text-ink/70 mt-6">
      Não tem conta?
      <a routerLink="/signup" class="text-clay underline">Criar conta</a>
    </p>
  </div>
</div>
